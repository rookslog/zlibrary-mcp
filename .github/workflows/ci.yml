name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full test suite including slow tests'
        type: boolean
        default: false

jobs:
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Processing corpus is preserved separately; acquisition tests need no LFS PDFs.
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: uv sync --frozen --group dev
      - run: npm run build
      - name: Verify targeted Jest scripts select tests
        shell: bash
        run: |
          for script in test:integration test:e2e:local; do
            if ! selected_files="$(npm run --silent "$script" -- --listTests)"; then
              echo "$script could not list its tests" >&2
              exit 1
            fi
            if [ -z "$selected_files" ]; then
              echo "$script selected no test files" >&2
              exit 1
            fi
            printf '%s\n' "$selected_files"
          done
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js
      - name: Run recorded bridge integration tests
        env:
          TEST_LIVE: 'false'
        run: npm run test:integration
      - run: uv run pytest -m "not slow and not integration and not performance" --benchmark-disable -rs

  rehearsal:
    name: Offline rehearsal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Keep rehearsal Python stable across runners.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --frozen --group dev
      - run: npm run build && npm run test:rehearsal
      - name: Upload rehearsal manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ matrix.os }}
          path: test_output/rehearsal-manifest.json
          if-no-files-found: error

  test-full:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.full_suite == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Processing corpus is preserved separately; acquisition tests need no LFS PDFs.
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: uv sync --frozen --group dev
      - run: npm run build
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js
      - run: uv run pytest -rs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          # Fixed audit-tool dependencies require Python >=3.11.
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --frozen --group dev
      - run: npm audit --omit=dev --audit-level=critical
      # Blocking gate: any advisory with an available fix must be picked up via
      # tool.uv.constraint-dependencies. Only advisories with NO shipped fix, or
      # whose fix is blocked by a documented pin, may be ignored here — each one
      # needs a reason on the line.
      - run: uv run pip-audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - run: npx eslint src/
      - run: npx prettier --check src/

  optional-dependency-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --no-dev
      - name: Check optional imports and core-only bridge behavior
        run: .venv/bin/python scripts/check_optional_imports.py --core-smoke

  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Pack and check tarball
        shell: bash
        run: |
          npm pack
          TARBALL=$(ls zlibrary-mcp-*.tgz | head -1)
          SIZE=$(stat --format="%s" "$TARBALL")
          echo "Tarball: $TARBALL, size: $SIZE bytes"
          if [ "$SIZE" -gt 10485760 ]; then
            echo "ERROR: Tarball exceeds 10MB ($SIZE bytes)"
            rm -f "$TARBALL"
            exit 1
          fi
          echo "OK: Tarball size within limit ($SIZE bytes)"
          echo "Contents:"
          tar tzf "$TARBALL"
          EXCLUDED=$(tar tzf "$TARBALL" | grep -E '/\.env$|\.test\.|\.spec\.|__tests__|\.pyc$' || true)
          if [ -n "$EXCLUDED" ]; then
            echo "ERROR: Tarball contains excluded patterns:"
            echo "$EXCLUDED"
            rm -f "$TARBALL"
            exit 1
          fi
          echo "OK: No excluded patterns found in tarball"
      # The packed layout differs from the repo (no src/, no test dirs), and
      # setuptools package discovery behaves differently in it: v1.3.1 shipped
      # with Python setup broken for every npm-installed user because the repo's
      # src/ dir had been masking a flat-layout discovery failure. Run the
      # Python environment setup inside the extracted tarball, exactly as the
      # README quickstart does.
      - name: Verify documented core setup works in the packed layout
        shell: bash
        run: |
          TARBALL=$(ls zlibrary-mcp-*.tgz | head -1)
          EXTRACT=$(mktemp -d)
          tar xzf "$TARBALL" -C "$EXTRACT"
          rm -f "$TARBALL"
          cd "$EXTRACT/package"
          test ! -d src
          test ! -d __tests__
          bash setup-uv.sh --no-dev
          .venv/bin/python -c "import importlib.util, pathlib, sys, zlibrary; root = pathlib.Path.cwd().resolve(); assert importlib.util.find_spec('pytest') is None; assert root in pathlib.Path(zlibrary.__file__).resolve().parents; sys.path.insert(0, 'lib'); import python_bridge" \
            && echo "OK: packed core setup excludes dev tools and bridge imports resolve"

  packed-install:
    name: Packed install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: ./.github/actions/setup
      - run: node scripts/check-packed-artifact.mjs --offline-providers

  install-upgrades:
    name: Published install upgrade/rollback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Legacy 1.4.0's processing stack needs its own supported interpreter lane.
      # The separate packed-install job still exercises the runner's default.
      # The upgrade script installs into temporary prefixes, so the runner uv
      # cache stays empty; on a new uv.lock key setup-uv would fail its post-job
      # save on the missing path.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: false
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-install-upgrades.mjs --matrix all --offline-providers

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - run: bash scripts/validate-readme-tools.sh

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: MCP initialize handshake
        env:
          ZLIBRARY_EMAIL: 'ci@test.com'
          ZLIBRARY_PASSWORD: 'ci-test-password'
        shell: bash
        run: |
          INIT_REQUEST='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke-test","version":"0.0.0"}}}'
          INIT_NOTIFICATION='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          # No grep filter: stdout is the JSON-RPC channel, so EVERY line must be a
          # valid MCP message. Filtering here would hide protocol-corrupting logs.
          printf '%s\n%s\n' "$INIT_REQUEST" "$INIT_NOTIFICATION" \
            | timeout 15 node dist/index.js 2>/dev/null > stdout.txt
          echo "Raw stdout:"; cat stdout.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" | jq -e '.jsonrpc == "2.0"' > /dev/null \
              || { echo "ERROR: non-MCP output on stdout: $line"; exit 1; }
          done < stdout.txt
          head -1 stdout.txt | jq -e '.jsonrpc == "2.0" and .id == 1 and .result.protocolVersion != null and .result.serverInfo.name == "book-acquisition" and .result.capabilities.tools != null'

  docker:
    # Exercise the published image on PRs so Python/wheel drift is caught (#230).
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --frozen --no-dev
      - run: npm run build
      - name: Check smoke runner and failure controls without Docker
        run: node --test __tests__/image-smoke.test.mjs __tests__/image-smoke-contract.test.mjs
      - name: Prepare release-tarball build context
        shell: bash
        run: |
          bash scripts/prepare-image-context.sh "$RUNNER_TEMP/image-context"
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.9.1
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.33.1
      - name: Build and load the attested image from the release tarball
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/image-context
          file: docker/Dockerfile
          build-args: BUILD_INPUT=packed
          load: true
          push: false
          provenance: mode=min
          tags: |
            zlibrary-mcp:ci
            localhost:5000/zlibrary-mcp:ci
      - name: Bind the loaded attested index to the build digest
        env:
          TESTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/image-identity.mjs zlibrary-mcp:ci "$TESTED_DIGEST"
      - name: Offline SDK-to-container-Python journey
        run: node scripts/image-smoke.mjs zlibrary-mcp:ci

      - name: Rehearse tested-image push and registry digest/provenance checks
        env:
          IMAGE_TAGS: localhost:5000/zlibrary-mcp:ci
          TESTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/push-tested-image.mjs zlibrary-mcp:ci "$TESTED_DIGEST"

  acquisition-windows:
    name: Offline acquisition leases (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --group dev
      - name: Verify native leases and canonical receipt recovery
        run: uv run pytest __tests__/python/test_acquisition_locking.py __tests__/python/test_acquisition_receipts.py --no-cov -rs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify lazy protocol on actual Windows Node and Python pipes
        env:
          LAZY_PROTOCOL_DIAGNOSTICS: '1'
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js __tests__/lazy-eapi-session.test.js --testNamePattern="native protocol" --runInBand --coverage=false
      - name: Verify bounded Python session framing and deferred initialization
        if: always()
        run: uv run pytest __tests__/python/test_lazy_eapi_session.py --no-cov -rs
      - name: Upload bounded synthetic native protocol diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-protocol-python-${{ matrix.python }}
          path: test_output/native-protocol/*.json
          if-no-files-found: warn
