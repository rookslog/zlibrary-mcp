# pyproject.toml - UV-based dependency management (v2.0.0)
#
# Z-Library MCP server with modern UV dependency management
# Setup: uv sync (creates .venv and installs dependencies)

[project]
name = "zlibrary-mcp"
version = "2.0.0"
description = "Z-Library MCP server for AI assistants"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "rookslog" }
]
keywords = ["mcp", "zlibrary", "ai", "books", "library"]
license = { text = "MIT" }

# Core dependencies for zlibrary-mcp functionality
# Based on actual usage from lib/*.py analysis
dependencies = [
    # Vendored zlibrary (installed from local ./zlibrary directory)
    "zlibrary",
    # Document processing
    "pymupdf>=1.26.0", # PDF processing (fitz)
    "ebooklib>=0.20", # EPUB processing
    # HTTP and async
    "httpx>=0.28.0", # HTTP client (used in booklists, advanced_search)
    "aiofiles>=24.1.0", # Async file operations
    # HTML parsing
    "beautifulsoup4>=4.14.0", # HTML parsing
    "lxml>=6.0.0", # XML/HTML parser (bs4 backend)
    # NLP for footnote detection
    "nltk>=3.8.1", # Sentence boundary detection
    "ocrmypdf>=16.13.0",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.1",
    "libgen-api-enhanced>=1.3",
]

# UV source configuration for vendored zlibrary
# This tells UV to install zlibrary from local path as editable
[tool.uv.sources]
zlibrary = { path = "./zlibrary", editable = true }

# Optional dependencies
[project.optional-dependencies]
# OCR capabilities for scanned PDFs (not currently active)
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "pillow>=11.0.0",
]

# Development and testing
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.0",
    "pytest-benchmark>=5.2.3",
]

# Development and test dependencies (PEP 735 dependency groups)
[dependency-groups]
dev = [
    "pytest>=9.0.3",  # PYSEC-2026-1845
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.0",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.14.14",
    "jsonschema>=4.26.0",
    "pytest-cov>=7.0.0",
    "pip-audit>=2.7.0",
    "pip>=26.2.1",  # PYSEC-2026-196, PYSEC-2026-2875, PYSEC-2026-2876 (pulled in by pip-audit)
]

[project.urls]
Homepage = "https://github.com/rookslog/zlibrary-mcp"
Repository = "https://github.com/rookslog/zlibrary-mcp.git"
Issues = "https://github.com/rookslog/zlibrary-mcp/issues"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Note: This project is primarily Node.js/TypeScript
# pyproject.toml is used for Python dependency management only
# The MCP server is built with: npm run build (TypeScript compilation)

# UV-specific configuration
[tool.uv]
# This pyproject exists for dependency management only — nothing imports the
# root project as a Python package (the bridge runs lib/*.py by path, and the
# importable `zlibrary` package is the vendored fork installed editable from
# ./zlibrary). package = false stops uv from building/installing the root.
# Without it the build only ever succeeded by accident: the repo's src/ dir
# flips setuptools to src-layout discovery (which finds nothing), while the
# published npm package ships no src/, so flat-layout discovery found
# ['lib', 'zlibrary', 'node_modules'] and refused to build — breaking
# `uv sync` for every npm-installed user.
package = false
# Dev dependencies are declared in [dependency-groups] (PEP 735), which uv
# gained in 0.4.27. The legacy `tool.uv.dev-dependencies` field that older
# clients understand is gone, so on a pre-0.4.27 uv the dev group is not
# installed and `uv run ruff` / `uv run pytest` fail with a confusing
# "not found" rather than a version complaint. Fail early and say why instead.
#
# This is a backstop, not the whole guard: a uv old enough to lack PEP 735 may
# also predate `required-version` and ignore this key. setup-uv.sh checks the
# version directly, which works regardless.
required-version = ">=0.4.27"
# Constraints to fix security vulnerabilities in transitive deps.
# Floors are raised to the lowest version pip-audit reports as fixed; keep them
# as `>=` so Dependabot/`uv lock --upgrade` can move forward without edits here.
constraint-dependencies = [
    "aiohttp>=3.14.1",       # PYSEC-2026-2094..2113 (22 advisories)
    "brotli>=1.2.0",         # CVE-2025-6176
    "click>=8.3.3",          # PYSEC-2026-2132
    "pdfminer.six>=20251230", # CVE-2025-64512, GHSA-f83h-ghpp-7wcc
    "cryptography>=50.0.0",  # PYSEC-2026-36, GHSA-537c-gmf6-5ccf, PYSEC-2026-3552
    "idna>=3.15",            # PYSEC-2026-215
    "lxml>=6.1.0",           # PYSEC-2026 lxml advisories
    "msgpack>=1.2.1",        # PYSEC-2026 msgpack advisory
    "nltk>=3.10.0",          # CVE-2025-14009, CVE-2026-33230, PYSEC-2026-3582..3584
    "pi-heif>=1.3.0",        # transitive via ocrmypdf image stack
    "pillow>=12.3.0",        # PYSEC-2026-3451..3496 (26 advisories)
    "pymupdf==1.26.5",         # Pin — 1.26.6 lacks Docker wheel, 1.26.7 breaks footnote extraction; CVE-2026-3029 ignored in CI
    "python-dotenv>=1.2.2",  # PYSEC-2026-2270
    "requests>=2.33.0",      # CVE-2026-25645
    "soupsieve>=2.8.4",      # PYSEC-2026-3071, PYSEC-2026-3072
    "ujson>=5.13.0",         # PYSEC-2026-2293, PYSEC-2026-2294
    "urllib3>=2.7.0",        # PYSEC-2026-141, PYSEC-2026-142
]

# Ruff configuration
[tool.ruff.lint]
# E402: Module-level import not at top of file
# Required because lib/ and __tests__/ scripts manipulate sys.path before imports
ignore = ["E402"]

# E741: Ambiguous variable names (single-letter vars in comprehensions)
extend-ignore = ["E741"]

# UV configuration options
[tool.uv.pip]
# Use PyPI as default index
index-url = "https://pypi.org/simple"

# Notes:
# - zlibrary will be installed as editable from ./zlibrary
# - All transitive dependencies handled automatically
# - uv.lock will be generated on first: uv sync
# - To add deps: uv add package-name
# - To install optional: uv sync --extra ocr
