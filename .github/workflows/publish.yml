name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lfs: false — the repo exceeded its Git LFS budget, which fails
          # actions/checkout outright. Unhydrated-pointer guards in
          # __tests__/python/conftest.py skip the affected tests with a clear
          # reason (surfaced by pytest -rs). Restore to true if the budget
          # is ever restored. See #85.
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: uv sync
      - run: npm run build
      - name: Run tests
        run: |
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          uv run pytest -m "not slow and not integration" --benchmark-disable
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      # Pinned to the npm@11 major — `npm@latest` is what broke releases v1.2
      # through v1.2.1 when its engines field outran the runner's Node.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # Auth comes from npm's OIDC trusted publisher for this repo/workflow —
      # no NODE_AUTH_TOKEN. Provenance is generated automatically under OIDC.
      - name: Publish with provenance
        run: npm publish --provenance

  # Ships the same release as a container image so Docker users get versioned
  # tags instead of having to build from source (requested in issue #9).
  # Tag pushes only: a workflow_dispatch has no semver ref, so metadata-action
  # would derive zero tags and the push step would fail.
  publish-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A tag that publishes to npm and GHCR but leaves no GitHub Release makes the
  # Releases page disagree with what is actually shipped. That happened to
  # v1.4.0 (#108): npm, GHCR and the tag were all live while Releases still
  # showed v1.3.2 as latest. The release notes are the CHANGELOG section for
  # this version, so the changelog stays the single source of truth — and the
  # extraction failing loudly is what keeps an unchangelogged release from
  # shipping silently.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Extract this version's CHANGELOG section
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/          { exit }
            f                      { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "ERROR: CHANGELOG.md has no '## [$VERSION]' section." >&2
            echo "Add the section before tagging; release notes come from it." >&2
            exit 1
          fi
          echo "Extracted $(wc -l < release-notes.md) lines of notes for $VERSION"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
